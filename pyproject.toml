[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-agent"
version = "0.1.0"
description = "Lightweight agent workflows with tools, traces, memory, and pluggable LLM backends."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "NxAgent Contributors" }]
keywords = ["ai", "agents", "llm", "workflow", "orchestration", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []   # zero hard deps — all LLM libs are optional

[project.optional-dependencies]
openai     = ["openai>=1.0"]
grok       = ["openai>=1.0"]
anthropic  = ["anthropic>=0.25"]
huggingface = ["huggingface_hub>=0.23"]
ollama     = ["ollama>=0.4"]
all        = [
    "openai>=1.0",
    "anthropic>=0.25",
    "huggingface_hub>=0.23",
    "ollama>=0.4",
]
dev        = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nx_agent*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
